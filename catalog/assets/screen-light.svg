    <path d="M289-26L321-26L421 101L413 111L390 94L373 65L352 53L331 29L319 29Z"/>
    <path d="M431-20L478-20L482 4L503 23L499 32L522 46L523 61L549 89L531 105L512 79L491 70L483 49L467 39L459 15Z"/>
    <path d="M531-26L559-26L588 12L606 17L613 38L632 48L650 81L640 98L618 78L605 74L592 54L572 41L563 19Z"/>
    <path d="M615-20H884V77L861 65L850 71L826 48L805 53L790 31L768 39L745 20L719 34L699 14L679 25L655 8L641 16Z" opacity=".6"/>
