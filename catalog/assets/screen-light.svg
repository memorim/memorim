    <filter id="penumbra" x="-15%" y="-30%" width="130%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <linearGradient id="falloff" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/><stop offset=".55" stop-color="white" stop-opacity=".85"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="top-light"><path fill="url(#falloff)" d="M0 0h884v794H0z"/></mask>
    <linearGradient id="glass" x1="100" y1="0" x2="760" y2="794" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4cc" stop-opacity=".16"/><stop offset=".36" stop-color="#fff9df" stop-opacity=".025"/>
      <stop offset="1" stop-color="#6f5437" stop-opacity=".045"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(350 390) rotate(62) scale(580 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffbe3" stop-opacity=".16"/><stop offset="1" stop-color="#fffbe3" stop-opacity="0"/>
    </radialGradient>
    <path id="leaf" d="M0 0C-22-7-32-26-28-43C-8-40 8-24 0 0Z"/>
  </defs>
  <path fill="url(#glass)" d="M0 0h884v794H0z"/>
  <path fill="url(#sun)" d="M0 0h884v794H0z"/>
  <g mask="url(#top-light)" filter="url(#penumbra)" fill="#796344" opacity=".24">
